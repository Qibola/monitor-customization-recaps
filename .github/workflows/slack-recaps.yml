name: Slack Recaps

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        type: choice
        options: [DRYRUN, DAILY, WEEKLY, MONTHLY]
        default: DRYRUN
      post_to_channel_id:
        description: "Override channel ID to post into (e.g., C0123ABCDEF), optional"
        required: false
        type: string

  schedule:
    # DAILY prep slot: run at 08:30 America/Denver to schedule delivery for 09:00.
    # Both UTC options are listed for DST; the job keeps only the one matching the current Denver offset.
    - cron: "30 14 * * *" # 08:30 during MDT (UTC-6)
    - cron: "30 15 * * *" # 08:30 during MST (UTC-7)

    # WEEKLY/MONTHLY prep slot: run at 13:30 America/Denver to schedule delivery for 14:00.
    - cron: "30 19 * * *" # 13:30 during MDT
    - cron: "30 20 * * *" # 13:30 during MST

concurrency:
  group: slack-recaps
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  recap:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # only used by the keepalive step at the end

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Decide scheduled run flags
        if: ${{ github.event_name == 'schedule' }}
        run: |
          EVENT_SCHEDULE="${{ github.event.schedule }}"
          OFFSET=$(TZ=America/Denver date +%z)
          DOW=$(TZ=America/Denver date +%u) # 1=Mon ... 5=Fri
          TOMORROW_DAY=$(TZ=America/Denver date -d 'tomorrow' +%d)

          echo "Event schedule: $EVENT_SCHEDULE"
          echo "Denver offset: $OFFSET"
          echo "DOW: $DOW"
          echo "Tomorrow day: $TOMORROW_DAY"
          echo "Local time: $(TZ=America/Denver date -Is)"
          echo "UTC time: $(date -u -Is)"

          if [ "$OFFSET" = "-0600" ]; then
            EXPECTED_DAILY_CRON="30 14 * * *"
            EXPECTED_PM_CRON="30 19 * * *"
          else
            EXPECTED_DAILY_CRON="30 15 * * *"
            EXPECTED_PM_CRON="30 20 * * *"
          fi

          # Daily: weekdays only. Monday's recap covers Sat + Sun together.
          if [ "$EVENT_SCHEDULE" = "$EXPECTED_DAILY_CRON" ] && [ "$DOW" -le 5 ]; then
            echo "RUN_DAILY=1" >> $GITHUB_ENV
            echo "DAILY_SCHEDULE_AT_LOCAL=09:00" >> $GITHUB_ENV
          fi

          # Weekly (Fridays) and monthly (last day of month) share the PM slot.
          if [ "$EVENT_SCHEDULE" = "$EXPECTED_PM_CRON" ]; then
            if [ "$DOW" = "5" ]; then
              echo "RUN_WEEKLY=1" >> $GITHUB_ENV
              echo "WEEKLY_SCHEDULE_AT_LOCAL=14:00" >> $GITHUB_ENV
            fi

            if [ "$TOMORROW_DAY" = "01" ]; then
              echo "RUN_MONTHLY=1" >> $GITHUB_ENV
              echo "MONTHLY_SCHEDULE_AT_LOCAL=14:00" >> $GITHUB_ENV
            fi
          fi

      - name: Debug
        run: |
          echo "RUN_DAILY=$RUN_DAILY"
          echo "RUN_WEEKLY=$RUN_WEEKLY"
          echo "RUN_MONTHLY=$RUN_MONTHLY"
          echo "DAILY_SCHEDULE_AT_LOCAL=$DAILY_SCHEDULE_AT_LOCAL"
          echo "WEEKLY_SCHEDULE_AT_LOCAL=$WEEKLY_SCHEDULE_AT_LOCAL"
          echo "MONTHLY_SCHEDULE_AT_LOCAL=$MONTHLY_SCHEDULE_AT_LOCAL"
          echo "CHANNEL_ID length: ${#CHANNEL_ID}"
          echo "WEEKLY_POST_TO_CHANNEL_ID length: ${#WEEKLY_POST_TO_CHANNEL_ID}"
          echo "MONTHLY_POST_TO_CHANNEL_ID length: ${#MONTHLY_POST_TO_CHANNEL_ID}"
          echo "INTERCOM_ACCESS_TOKEN length: ${#INTERCOM_ACCESS_TOKEN}"
          echo "Local time: $(TZ=America/Denver date -Is)"
          echo "UTC time: $(date -u -Is)"
        env:
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          WEEKLY_POST_TO_CHANNEL_ID: ${{ secrets.WEEKLY_POST_TO_CHANNEL_ID }}
          MONTHLY_POST_TO_CHANNEL_ID: ${{ secrets.MONTHLY_POST_TO_CHANNEL_ID }}
          INTERCOM_ACCESS_TOKEN: ${{ secrets.INTERCOM_ACCESS_TOKEN }}

      - name: Manual run
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          INTERCOM_ACCESS_TOKEN: ${{ secrets.INTERCOM_ACCESS_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          WEEKLY_POST_TO_CHANNEL_ID: ${{ secrets.WEEKLY_POST_TO_CHANNEL_ID }}
          MONTHLY_POST_TO_CHANNEL_ID: ${{ secrets.MONTHLY_POST_TO_CHANNEL_ID }}
          MODE: ${{ inputs.mode }}
          TZ_NAME: America/Denver
          POST_TO_CHANNEL_ID: ${{ inputs.post_to_channel_id }}
        run: python recap_bot.py

      - name: Scheduled daily recap
        if: ${{ github.event_name == 'schedule' && env.RUN_DAILY == '1' }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          INTERCOM_ACCESS_TOKEN: ${{ secrets.INTERCOM_ACCESS_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          WEEKLY_POST_TO_CHANNEL_ID: ${{ secrets.WEEKLY_POST_TO_CHANNEL_ID }}
          MONTHLY_POST_TO_CHANNEL_ID: ${{ secrets.MONTHLY_POST_TO_CHANNEL_ID }}
          MODE: DAILY
          TZ_NAME: America/Denver
          SCHEDULE_AT_LOCAL: ${{ env.DAILY_SCHEDULE_AT_LOCAL }}
        run: python recap_bot.py

      - name: Scheduled weekly recap
        if: ${{ github.event_name == 'schedule' && env.RUN_WEEKLY == '1' }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          INTERCOM_ACCESS_TOKEN: ${{ secrets.INTERCOM_ACCESS_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          WEEKLY_POST_TO_CHANNEL_ID: ${{ secrets.WEEKLY_POST_TO_CHANNEL_ID }}
          MONTHLY_POST_TO_CHANNEL_ID: ${{ secrets.MONTHLY_POST_TO_CHANNEL_ID }}
          MODE: WEEKLY
          TZ_NAME: America/Denver
          SCHEDULE_AT_LOCAL: ${{ env.WEEKLY_SCHEDULE_AT_LOCAL }}
        run: python recap_bot.py

      - name: Scheduled monthly recap
        if: ${{ github.event_name == 'schedule' && env.RUN_MONTHLY == '1' }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          INTERCOM_ACCESS_TOKEN: ${{ secrets.INTERCOM_ACCESS_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          WEEKLY_POST_TO_CHANNEL_ID: ${{ secrets.WEEKLY_POST_TO_CHANNEL_ID }}
          MONTHLY_POST_TO_CHANNEL_ID: ${{ secrets.MONTHLY_POST_TO_CHANNEL_ID }}
          MODE: MONTHLY
          TZ_NAME: America/Denver
          SCHEDULE_AT_LOCAL: ${{ env.MONTHLY_SCHEDULE_AT_LOCAL }}
        run: python recap_bot.py

      # GitHub turns off scheduled workflows after 60 days without repo activity.
      # Re-enabling the workflow on every scheduled run keeps it from being switched off again.
      - name: Keepalive
        if: ${{ github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable slack-recaps.yml --repo "${{ github.repository }}" || echo "keepalive skipped"
